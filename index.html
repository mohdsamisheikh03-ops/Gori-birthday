<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="title" content="Happy Birthday Gori ❤️">
<title>Birthday Surprise for Gori</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,Segoe UI,sans-serif}
body{overflow-x:hidden;background:linear-gradient(135deg,#fff1f7,#f8efff);color:#6b3158}
#wrapper{min-height:100vh;position:relative;overflow:hidden}
.flag__birthday{position:absolute;top:10px;left:0;right:0;display:flex;justify-content:space-between;opacity:.9}
.flag__birthday img{max-width:32vw;height:auto}
.content{min-height:100vh;display:flex;align-items:center;justify-content:center;gap:45px;padding:70px 30px 40px;position:relative;z-index:2}
.left{text-align:center;max-width:540px}.right{position:relative;width:360px;min-height:440px;display:flex;align-items:center;justify-content:center}
.happy,.birthday{margin:0;font-weight:900;line-height:.95;text-shadow:0 7px 20px #d87aa633}
.happy{font-size:clamp(3.5rem,10vw,6rem);color:#e85b8c}
.birthday{font-size:clamp(3rem,8vw,5.2rem);color:#8c55b8}
.happy span,.birthday span{display:inline-block;animation:letterIn .8s both;animation-delay:var(--t)}
@keyframes letterIn{from{opacity:0;transform:translateY(35px) rotate(8deg)}to{opacity:1;transform:none}}
.hat{margin-top:-5px}.hat img{filter:drop-shadow(0 8px 8px #0002)}
.date__of__birth{margin:24px auto;font-size:1.1rem;font-weight:800;min-height:30px}.date__of__birth i{margin:0 8px;color:#e85b8c}
.btn button{border:0;border-radius:999px;padding:14px 24px;background:#e85b8c;color:white;font-size:1.05rem;font-weight:800;cursor:pointer;box-shadow:0 10px 25px #e85b8c44}
.btn button:hover{transform:translateY(-2px)}
.box__account{width:270px;text-align:center;position:relative}.image{width:220px;height:220px;margin:auto;border-radius:50%;padding:7px;background:white;box-shadow:0 15px 35px #0002;overflow:hidden}.image img{width:100%;height:100%;object-fit:cover;border-radius:50%}
.name{font-size:1.7rem;font-weight:900;margin-top:18px;color:#e85b8c}.name i{font-size:1rem;margin:0 7px}
.balloon_one,.balloon_two{position:absolute;top:5px}.balloon_one{left:-25px}.balloon_two{right:-25px}.balloon_one img,.balloon_two img{max-width:80px}
.cricle{position:absolute;right:-10px;bottom:5px;width:125px;height:125px;border-radius:50%;background:#fff7;display:flex;align-items:center;justify-content:center;box-shadow:0 10px 25px #0001}
.text__cricle{position:absolute;width:100%;height:100%;animation:spin 12s linear infinite}.text__cricle span{position:absolute;left:50%;top:5px;transform-origin:0 58px;transform:rotate(calc(24deg * var(--i)));font-weight:800;font-size:.72rem;color:#a04b80}
.cricle>i{font-size:2rem;color:#e85b8c}@keyframes spin{to{transform:rotate(360deg)}}
.decorate_star{position:absolute;width:13px;height:13px;background:#ffd36e;transform:rotate(45deg);animation:float 4s ease-in-out infinite;z-index:1}.star1{left:8%;top:25%}.star2{left:35%;top:15%;animation-delay:.5s}.star3{right:28%;top:18%;animation-delay:1s}.star4{right:8%;top:35%;animation-delay:1.5s}.star5{left:20%;bottom:15%;animation-delay:2s}
@keyframes float{50%{transform:translateY(-18px) rotate(135deg)}}
.decorate_flower--one,.decorate_flower--two,.decorate_flower--three{position:absolute;z-index:1}.decorate_flower--one{left:18%;bottom:10%}.decorate_flower--two{right:20%;top:30%}.decorate_flower--three{left:50%;top:10%}
.decorate_bottom{position:absolute;left:0;bottom:0}.smiley__icon{position:absolute;right:15px;bottom:10px}.decorate_bottom img,.smiley__icon img{max-width:80px}
.box__letter{display:none;position:fixed;inset:0;background:#0006;z-index:2000;padding:20px;overflow:auto}
.letter__border{display:none;max-width:850px;margin:7vh auto;background:#fff9fc;border-radius:24px;padding:18px;box-shadow:0 25px 70px #0004;position:relative}
.letter{background:#fff;border-radius:18px;padding:22px}.title__letter{text-align:center;font-size:2rem;font-weight:900;color:#e85b8c;min-height:42px}.content__letter{display:flex;gap:25px;align-items:center}.content__letter>.left{flex:1}.content__letter>.right{flex:1;width:auto;min-height:auto;display:block}.content__letter img{max-width:100%}.love__img{text-align:center;opacity:0;transform:scale(.8);transition:.7s}.animationOp{opacity:1!important;transform:scale(1)!important}.text__letter{font-size:1.05rem;line-height:1.7;margin-top:10px}.text__letter p{margin:0}.close{position:absolute;right:10px;top:7px;width:38px;height:38px;border-radius:50%;background:#e85b8c;color:white;display:grid;place-items:center;cursor:pointer;font-size:1.2rem}.heart{opacity:0;position:relative}.heart.animation{animation:heartFloat 1.3s ease-in-out forwards;opacity:1}.heart_1{animation-delay:.1s}.heart_2{animation-delay:.3s}.heart_3{animation-delay:.5s}.heart_4{animation-delay:.7s}@keyframes heartFloat{from{transform:translateY(20px) scale(.4);opacity:0}to{transform:translateY(0) scale(1);opacity:1}}
@media(max-width:800px){.content{flex-direction:column;gap:5px;padding-top:90px}.right{width:320px;min-height:360px}.image{width:190px;height:190px}.content__letter{flex-direction:column}.content__letter>.right{width:100%}.flag__birthday img{max-width:45vw}}
</style>
</head>
<body>
<div id="wrapper">
  <div class="flag__birthday"><img src="./images/1.png" alt="" width="350"><img src="./images/1.png" alt="" width="350"></div>
  <div class="content">
    <div class="left">
      <div class="title">
        <h1 class="happy">
          <span style="--t:.2s">H</span><span style="--t:.35s">a</span><span style="--t:.5s">p</span><span style="--t:.65s">p</span><span style="--t:.8s">y</span>
        </h1>
        <h1 class="birthday">
          <span style="--t:1s">B</span><span style="--t:1.15s">i</span><span style="--t:1.3s">r</span><span style="--t:1.45s">t</span><span style="--t:1.6s">h</span><span style="--t:1.75s">d</span><span style="--t:1.9s">a</span><span style="--t:2.05s">y</span>
        </h1>
        <div class="hat"><img src="./images/hat.png" alt="Birthday hat" width="130"></div>
      </div>
      <div class="date__of__birth"><span></span></div>
      <div class="btn"><button id="btn__letter">Click here <span>💌</span></button></div>
    </div>
    <div class="right">
      <div class="box__account">
        <div class="image"><img src="./images/r5.jpg" alt="Gori"></div>
        <div class="name"><i>♥</i><span>Gori</span><i>♥</i></div>
        <div class="balloon_one"><img width="100" src="./images/balloon1.png" alt=""></div>
        <div class="balloon_two"><img width="100" src="./images/balloon2.png" alt=""></div>
      </div>
      <div class="cricle"><div class="text__cricle">
        <span style="--i:1">h</span><span style="--i:2">a</span><span style="--i:3">p</span><span style="--i:4">p</span><span style="--i:5">y</span><span style="--i:6">-</span><span style="--i:7">b</span><span style="--i:8">i</span><span style="--i:9">r</span><span style="--i:10">t</span><span style="--i:11">h</span><span style="--i:12">d</span><span style="--i:13">a</span><span style="--i:14">y</span><span style="--i:15">-</span>
      </div><i>♥</i></div>
    </div>
  </div>
  <div class="decorate_star star1"></div><div class="decorate_star star2"></div><div class="decorate_star star3"></div><div class="decorate_star star4"></div><div class="decorate_star star5"></div>
  <div class="decorate_flower--one"><img width="20" src="./images/decorate_flower.png" alt=""></div>
  <div class="decorate_flower--two"><img width="20" src="./images/decorate_flower.png" alt=""></div>
  <div class="decorate_flower--three"><img width="20" src="./images/decorate_flower.png" alt=""></div>
  <div class="decorate_bottom"><img src="./images/decorate.png" alt="" width="100"></div>
  <div class="smiley__icon"><img src="./images/smiley_icon.png" alt="" width="100"></div>

  <div class="box__letter">
    <div class="letter__border">
      <div class="letter">
        <div class="title__letter"></div>
        <div class="content__letter">
          <div class="left">
            <img id="heart__letter" src="./images/heart.png" alt="Heart" width="120">
            <img class="heart heart_1" width="20" src="./images/heart.png" alt="">
            <img class="heart heart_2" width="20" src="./images/heart.png" alt="">
            <img class="heart heart_3" width="20" src="./images/heart.png" alt="">
            <img class="heart heart_4" width="20" src="./images/heart.png" alt="">
          </div>
          <div class="right">
            <div class="love__img"><img src="./images/mewmew.gif" alt="" width="180"></div>
            <div class="text__letter"><p></p></div>
            <img id="mewmew" width="80" src="./images/mewmew.gif" alt=""></div>
        </div>
      </div>
      <div class="close">×</div>
    </div>
  </div>
</div>

<script>
const datetxt = "22 September";
const datatxtletter = "Happy Birthday, Gori! ❤️ May God always keep you happy, blessed and smiling. May you achieve everything you wish for, succeed in every step of your life, and always stay the same wonderful person you are. Wishing you endless happiness, peace and success. I’m truly grateful for all the memories, laughs and moments we’ve shared. Have the best birthday and keep smiling always! 🫶🏻🎂✨";
const titleLetter = "To Gori ❤️";
let dateI=0,titleI=0,textI=0;
const dateEl=document.querySelector(".date__of__birth span");
const textEl=document.querySelector(".text__letter p");
setTimeout(()=>{const timer=setInterval(()=>{if(dateI<datetxt.length)dateEl.textContent+=datetxt[dateI++];else{clearInterval(timer);}},100)},1800);

document.querySelector("#btn__letter").addEventListener("click",()=>{
  const box=document.querySelector(".box__letter"), border=document.querySelector(".letter__border");
  box.style.display="block"; setTimeout(()=>border.style.display="block",250);
  setTimeout(()=>{
    const timer=setInterval(()=>{
      if(titleI<titleLetter.length){document.querySelector(".title__letter").textContent+=titleLetter[titleI++];}
      else clearInterval(timer);
    },100);
  },700);
  setTimeout(()=>{
    document.querySelector("#heart__letter").classList.add("animationOp");
    document.querySelector(".love__img").classList.add("animationOp");
    document.querySelector("#mewmew").classList.add("animationOp");
  },1300);
  setTimeout(()=>document.querySelectorAll(".heart").forEach(x=>x.classList.add("animation")),1700);
  setTimeout(()=>{
    const timer=setInterval(()=>{
      if(textI<datatxtletter.length)textEl.textContent+=datatxtletter[textI++];
      else clearInterval(timer);
    },28);
  },2300);
});
document.querySelector(".close").addEventListener("click",()=>{
  document.querySelector(".box__letter").style.display="none";
  document.querySelector(".letter__border").style.display="none";
  document.querySelector(".title__letter").textContent=""; textEl.textContent="";
  titleI=0;textI=0;
  document.querySelector("#heart__letter").classList.remove("animationOp");
  document.querySelector(".love__img").classList.remove("animationOp");
  document.querySelector("#mewmew").classList.remove("animationOp");
  document.querySelectorAll(".heart").forEach(x=>x.classList.remove("animation"));
});
</script>
</body>
</html>
